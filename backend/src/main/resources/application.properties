spring.application.name=InventoryLogic
server.port=8081

# Βάση: inventory_app (δημιουργήστε με CREATE DATABASE inventory_app στο MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=test1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI (τεκμηρίωση REST API)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (αλλάξτε το secret σε production)
jwt.secret=InventoryLogicSecretKeyForJWTMustBeAtLeast32Characters
jwt.validity-ms=86400000

# CORS: allowed origins (comma-separated). Για πρόσβαση από κινητό στο LAN πρόσθεσε http://IP-PC:5173, http://IP-PC:5174
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://192.168.1.2:5173,http://192.168.1.2:5174

# Admin: either use your own email (recommended for production) or default user below.
# Option A — Your own admin: 1) Register in the app with your real email. 2) Create file
#   backend/application-local.properties (this file is in .gitignore, do NOT commit it)
#   with content: admin.email=your@real.email
# 3) Restart backend. That user becomes admin.
# Option B — Default demo admin (below) is used only when admin.email is not set.
spring.config.import=optional:file:./application-local.properties
admin.user=admin@inventory.local
admin.username=admin
admin.password=admin12
