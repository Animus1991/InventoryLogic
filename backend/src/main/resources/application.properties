spring.application.name=InventoryLogic
server.port=8081

# Βάση: inventory_app (δημιουργήστε με CREATE DATABASE inventory_app στο MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=test1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI (τεκμηρίωση REST API)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (αλλάξτε το secret σε production)
jwt.secret=InventoryLogicSecretKeyForJWTMustBeAtLeast32Characters
jwt.validity-ms=86400000

# CORS: allowed origins (comma-separated). Για production αλλάξτε κατάλληλα.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

# Demo admin (μόνο για ανάπτυξη/demo· για production χρησιμοποιήστε env ADMIN_USER, ADMIN_PASSWORD)
admin.user=admin@inventory.local
admin.username=admin
admin.password=admin12
